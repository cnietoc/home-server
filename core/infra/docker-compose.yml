name: ${STACK_PREFIX}

networks:
  hms-network:
    external: true

x-hms:
  description: "Servicios de infraestructura base"
  public_ports:
    - { port: 80, protocol: tcp, description: "HTTP (Traefik)" }
    - { port: 443, protocol: tcp, description: "HTTPS (Traefik)" }

services:
  traefik:
    image: traefik:latest
    container_name: ${STACK_PREFIX}-traefik
    restart: unless-stopped
    networks:
      - hms-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${STACK_DIR}/traefik:/etc/traefik:ro
      - ${STACK_DATA}/traefik/certs:/certs
      - ${STACK_DATA}/traefik/logs:/logs
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN}
    command:
      # API y Dashboard (solo vía router api@internal, autenticado con TinyAuth)
      - --api.dashboard=true

      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # Providers
      - --providers.docker=true
      - --providers.docker.network=hms-network
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      # Certificados SSL con Let's Encrypt
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.storage=/certs/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53

      # Logs
      - --log.level=INFO
      - --log.filepath=/logs/traefik.log
      - --accesslog=true
      - --accesslog.filepath=/logs/access.log

      # Redirect HTTP to HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hms-network"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=cloudflare"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=tinyauth@docker"
      - "hms.description=🔀 Traefik Dashboard"

  tinyauth:
    image: ghcr.io/steveiliop56/tinyauth:latest
    container_name: ${STACK_PREFIX}-tinyauth
    restart: unless-stopped
    networks:
      - hms-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${STACK_DATA}/tinyauth:/data
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - TINYAUTH_APPURL=https://auth.${DOMAIN}
      - TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTID=${AUTH_GOOGLE_CLIENT_ID}
      - TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTSECRET=${AUTH_GOOGLE_CLIENT_SECRET}
      - TINYAUTH_OAUTH_WHITELIST=${AUTH_OAUTH_WHITELIST}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hms-network"
      - "traefik.http.routers.tinyauth.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.tinyauth.tls=true"
      - "traefik.http.routers.tinyauth.tls.certresolver=cloudflare"
      - "traefik.http.middlewares.tinyauth.forwardauth.address=http://tinyauth:3000/api/auth/traefik"
      - "traefik.http.middlewares.tinyauth.forwardauth.maxResponseBodySize=1048576"
      - "hms.description=🔐 Panel de Autenticación"

  beszel:
    image: henrygd/beszel:latest
    container_name: ${STACK_PREFIX}-beszel
    restart: unless-stopped
    networks:
      - hms-network
    volumes:
      - ${STACK_DATA}/beszel/data:/beszel_data
      - ${STACK_DATA}/beszel/socket:/beszel_socket
    environment:
      - TZ=${TZ}
      - APP_URL=https://monitor.${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hms-network"
      - "traefik.http.routers.beszel.rule=Host(`monitor.${DOMAIN}`)"
      - "traefik.http.routers.beszel.tls=true"
      - "traefik.http.routers.beszel.tls.certresolver=cloudflare"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"
      - "traefik.http.routers.beszel.middlewares=tinyauth@docker"
      - "hms.description=📊 Monitor del servidor (Beszel)"

  error-pages:
    image: ghcr.io/tarampampam/error-pages:latest
    container_name: ${STACK_PREFIX}-error-pages
    restart: unless-stopped
    networks:
      - hms-network
    environment:
      - TZ=${TZ}
      - TEMPLATE_NAME=shuffle
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hms-network"
      # Router "catch-all": prioridad mínima para que cualquier Host() específico gane siempre
      - "traefik.http.routers.error-pages-router.rule=HostRegexp(`.+`)"
      - "traefik.http.routers.error-pages-router.priority=1"
      - "traefik.http.routers.error-pages-router.entrypoints=websecure"
      - "traefik.http.routers.error-pages-router.tls=true"
      - "traefik.http.routers.error-pages-router.tls.certresolver=cloudflare"
      - "traefik.http.routers.error-pages-router.tls.domains[0].main=${DOMAIN}"
      - "traefik.http.routers.error-pages-router.tls.domains[0].sans=*.${DOMAIN}"
      - "traefik.http.routers.error-pages-router.service=error-pages-service"
      - "traefik.http.routers.error-pages-router.middlewares=error-pages-middleware@docker"
      - "traefik.http.services.error-pages-service.loadbalancer.server.port=8080"
      # Middleware de errores: solo se usa desde el router catch-all de arriba
      - "traefik.http.middlewares.error-pages-middleware.errors.status=400-599"
      - "traefik.http.middlewares.error-pages-middleware.errors.service=error-pages-service"
      - "traefik.http.middlewares.error-pages-middleware.errors.query=/{status}"
      - "hms.description=🚫 Páginas de error personalizadas"

  beszel-agent:
    image: henrygd/beszel-agent:alpine
    container_name: ${STACK_PREFIX}-beszel-agent
    restart: unless-stopped
    networks:
      - hms-network
    cap_add:
      - SYS_RAWIO # S.M.A.R.T. data (SATA/SAS)
      - SYS_ADMIN # S.M.A.R.T. data (NVMe)
    # `devices:` (mapeo de discos físicos) se añade dinámicamente por
    # pre-deploy.sh en docker-compose.override.yml — ver ese fichero.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${STACK_DATA}/beszel/socket:/beszel_socket
      - ${STACK_DATA}/beszel/agent:/var/lib/beszel-agent
    environment:
      - TZ=${TZ}
      - LISTEN=/beszel_socket/beszel.sock
      - HUB_URL=http://beszel:8090
      - TOKEN=${BESZEL_TOKEN}
      - KEY=${BESZEL_KEY}

