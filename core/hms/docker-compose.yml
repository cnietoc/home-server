name: hms

networks:
  hms-network:
    name: hms-network
    driver: bridge

services:
  app:
    user: ${PUID}:${PGID}
    build:
      context: ../..
      dockerfile: core/hms/Dockerfile
      args:
        - PUID=${PUID}
        - PGID=${PGID}
    container_name: hms
    restart: unless-stopped
    environment:
      # Cap glibc malloc arenas (default is 8 x nproc = 32 on this 4-CPU host).
      # The daemon runs ~4 threads; uncapped arenas inflate RSS retention.
      - MALLOC_ARENA_MAX=2
      # Return freed heap to the OS sooner, lowering steady-state RSS after peaks.
      - MALLOC_TRIM_THRESHOLD_=131072
    networks:
      - hms-network
    group_add:
      - ${DOCKER_GID}  # Agregar al grupo de Docker para acceso al docker.sock
    volumes:
      - ../../config.toml:/app/config.toml
      - ../../data:/app/data
      - ../../logs:/app/logs
      - ../../core:/app/core
      - ../../stacks:/app/stacks
      - ../../backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock
    labels: {}
