name: hms

networks:
  hms-network:
    name: hms-network
    driver: bridge

services:
  app:
    user: ${PUID}:${PGID}
    build:
      context: ../..
      dockerfile: core/hms/Dockerfile
      args:
        - PUID=${PUID}
        - PGID=${PGID}
    container_name: hms
    restart: unless-stopped
    networks:
      - hms-network
    group_add:
      - ${DOCKER_GID}  # Agregar al grupo de Docker para acceso al docker.sock
    volumes:
      - ../../config.toml:/app/config.toml
      - ../../data:/app/data
      - ../../logs:/app/logs
      - ../../core:/app/core
      - ../../stacks:/app/stacks
      - ../../backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "false"
