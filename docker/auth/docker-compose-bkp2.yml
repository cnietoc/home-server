networks:
  proxy:
    external: true


services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    networks:
      - proxy

    environment:
      # --- General ---
      AUTHELIA_SERVER_ADDRESS: tcp://0.0.0.0:9091
      AUTHELIA_LOG_LEVEL: info
      AUTHELIA_THEME: dark
      AUTHELIA_DEFAULT_REDIRECTION_URL: https://auth.${BASE_DOMAIN}

      # --- Secrets (del .env) ---
      AUTHELIA_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}

      # --- Session ---
      AUTHELIA_SESSION_DOMAIN: ${BASE_DOMAIN}
      AUTHELIA_SESSION_EXPIRATION: 1h
      AUTHELIA_SESSION_INACTIVITY: 5m
      AUTHELIA_SESSION_SAME_SITE: lax
      AUTHELIA_SESSION_NAME: authelia_session

      # --- Authentication (Google OAuth2) ---
      AUTHELIA_AUTHENTICATION_BACKEND_DISABLE_RESET_PASSWORD: "true"
      AUTHELIA_AUTHENTICATION_BACKEND_OIDC_ENABLED: "true"
      AUTHELIA_AUTHENTICATION_BACKEND_OIDC_PROVIDER: google
      AUTHELIA_AUTHENTICATION_BACKEND_OIDC_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      AUTHELIA_AUTHENTICATION_BACKEND_OIDC_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AUTHELIA_AUTHENTICATION_BACKEND_OIDC_SCOPE: openid email profile
      AUTHELIA_AUTHENTICATION_BACKEND_OIDC_ENDPOINT_AUTH_METHOD: client_secret_basic
      AUTHELIA_AUTHENTICATION_BACKEND_OIDC_DISCOVERY_URL: https://accounts.google.com/.well-known/openid-configuration

      # --- Authentication Backend ---
      AUTHELIA_AUTHENTICATION_BACKEND_FILE_PATH: /config/users_database.yml
      AUTHELIA_AUTHENTICATION_BACKEND_FILE_PASSWORD_ALGORITHM: argon2id
      AUTHELIA_AUTHENTICATION_BACKEND_FILE_PASSWORD_ITERATIONS: 1
      AUTHELIA_AUTHENTICATION_BACKEND_FILE_PASSWORD_SALT_LENGTH: 16
      AUTHELIA_AUTHENTICATION_BACKEND_FILE_PASSWORD_PARALLELISM: 8
      AUTHELIA_AUTHENTICATION_BACKEND_FILE_PASSWORD_MEMORY: 128

      # --- Storage ---
      AUTHELIA_STORAGE_LOCAL_PATH: /config/db.sqlite3

      # --- Notifier ---
      AUTHELIA_NOTIFIER_FILESYSTEM_FILENAME: /config/notification.txt
      AUTHELIA_NOTIFIER_DISABLE_STARTUP_CHECK: true

      # --- Access Control ---
      AUTHELIA_ACCESS_CONTROL_DEFAULT_POLICY: deny
      AUTHELIA_ACCESS_CONTROL_RULES_0_DOMAIN: "*.${BASE_DOMAIN}"
      AUTHELIA_ACCESS_CONTROL_RULES_0_POLICY: one_factor
      AUTHELIA_ACCESS_CONTROL_RULES_1_DOMAIN: "hello.${BASE_DOMAIN}"
      AUTHELIA_ACCESS_CONTROL_RULES_1_POLICY: bypass

    ports:
      - "9091:9091"
    volumes:
      - ../../data/auth/authelia/config:/config

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.${BASE_DOMAIN}`)"
      - "traefik.http.routers.authelia.tls=true"
      - "traefik.http.routers.authelia.tls.certresolver=cloudflare"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"

      # Middleware de autenticación para otros servicios
      - "traefik.http.middlewares.authelia.forwardAuth.address=http://authelia:9091/api/verify?rd=https://auth.${BASE_DOMAIN}/"
      - "traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
