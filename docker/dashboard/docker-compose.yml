networks:
  proxy:
    external: true

services:

  dashboard-web:
    build: .
    container_name: dashboard-web
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      # Acceso a la configuración de stacks (solo lectura)
      - ../../config/stacks.yml:/config/stacks.yml:ro
      # Acceso al socket de Docker para obtener información
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Acceso a información del sistema
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_DOMAIN=${BASE_DOMAIN}
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    labels:
      traefik.enable: true
      traefik.http.routers.hello.rule: "Host(`hello.${BASE_DOMAIN}`)"
      traefik.http.routers.hello.tls: "true"
      traefik.http.routers.hello.tls.certresolver: "cloudflare"
      traefik.http.services.hello.loadbalancer.server.port: "3000"
