networks:
  proxy:
    external: true

services:
  # Dashboard dinámico del Home Server
  dashboard:
    build: .
    container_name: ${STACK_NAME}_dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_DOMAIN=${BASE_DOMAIN}
    volumes:
      # Acceso a la configuración de stacks (solo lectura)
      - ../../config/stacks.yml:/config/stacks.yml:ro
      # Acceso al socket de Docker para obtener información
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Acceso a información del sistema
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - proxy
    labels:
      # Traefik configuration para dominio principal (sin subdominio)
      - "traefik.enable=true"
      - "traefik.http.routers.root.rule=Host(`${BASE_DOMAIN}`)"
      - "traefik.http.routers.root.entrypoints=websecure"
      - "traefik.http.routers.root.tls.certresolver=cloudflare"
      - "traefik.http.services.root.loadbalancer.server.port=3000"
