networks:
  proxy:
    external: true

services:
  # Dashboard dinámico del Home Server
  dashboard:
    build: .
    container_name: dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_DOMAIN=${BASE_DOMAIN}
    volumes:
      # Acceso a la configuración de stacks (solo lectura)
      - ../../config/stacks.yml:/config/stacks.yml:ro
      # Acceso al socket de Docker para obtener información
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Acceso a información del sistema
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - proxy
    labels:
      # Traefik configuration para dominio principal (sin subdominio)
      - "traefik.enable=true"
      - "traefik.http.routers.test.rule=Host(`test.${BASE_DOMAIN}`)"
      - "traefik.http.routers.test.tls.certresolver=cloudflare"
      - "traefik.http.services.test.loadbalancer.server.port=3000"
