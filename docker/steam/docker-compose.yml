networks:
  proxy:
    external: true

services:
  asf:
    image: justarchi/archisteamfarm:latest
    container_name: ${STACK_NAME}-asf
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      # Almacenamiento en data/steam/
      - ${STACK_DATA}/config:/app/config
      - ${STACK_DATA}/logs:/app/logs
      - ${STACK_DATA}/cache:/app/cache
    environment:
      # Variables básicas
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "1242:1242"  # Puerto IPC de ASF (local)
    labels:
      # Traefik routing
      traefik.enable: "true"
      traefik.http.routers.asf.rule: "Host(`asf.${BASE_DOMAIN}`)"
      traefik.http.routers.asf.tls: "true"
      traefik.http.routers.asf.tls.certresolver: "cloudflare"
      traefik.http.routers.asf.middlewares: "tinyauth@docker"
      traefik.http.services.asf.loadbalancer.server.port: "1242"
