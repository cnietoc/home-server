services:
  hms:
    build:
      context: ../..
      dockerfile: docker/hms/Dockerfile
    container_name: hms
    restart: always
    environment:
      DOCKER_CLI_HINTS: false
    volumes:
      - ../..:/project
      - ../../data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "python", "-m", "hms", "show", "stacks"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      # Excluir de Watchtower (imagen construida localmente)
      com.centurylinklabs.watchtower.enable: "false"
