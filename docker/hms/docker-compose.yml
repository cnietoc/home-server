services:
  hms:
    build:
      context: ../..
      dockerfile: docker/hms/Dockerfile
    container_name: hms
    restart: always
    volumes:
      - ../../config:/app/config:ro
      - ../../docker:/app/docker
      - ../../data:/app/data
      - ../../logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    labels:
      com.centurylinklabs.watchtower.enable: "false"
