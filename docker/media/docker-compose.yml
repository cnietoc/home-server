services:
  # Jellyfin - Servidor de medios
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:latest
    container_name: ${STACK_NAME}-jellyfin
    restart: unless-stopped
    networks:
      - proxy
      - media_internal
    volumes:
      - ${STACK_DATA}/config/jellyfin:/config
      - ${STACK_DATA}/config/jellyfin/temp:/cache
      - ${STACK_DATA}/library:/media/library:ro
      - ${STACK_DATA}/recordings:/media/recordings/:rw
      - ${STACK_DATA}/downloads/complete:/media/downloads/complete:ro
    ports:
      - "8096:8096"       # Puerto interno (opcional, para acceso directo sin proxy)
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - JELLYFIN_CACHE_DIR=/cache
      - JELLYFIN_PublishedServerUrl=https://jellyfin.${BASE_DOMAIN}
      # Configuraciones para reproducción directa sin transcodificación
      - JELLYFIN_FFmpeg_probesize=50000000
      - JELLYFIN_FFmpeg_analyzeduration=50000000
    labels:
      traefik.enable: true
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.${BASE_DOMAIN}`)"
      traefik.http.routers.jellyfin.tls: "true"
      traefik.http.routers.jellyfin.tls.certresolver: "cloudflare"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"

  # qBittorrent - Cliente BitTorrent
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:latest
    container_name: ${STACK_NAME}-qbittorrent
    restart: unless-stopped
    networks:
      - proxy
      - media_internal
    volumes:
      - ${STACK_DATA}/config/qbittorrent:/config
      - ${STACK_DATA}/downloads:/media/downloads
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - WEBUI_PORT=8080
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    labels:
      traefik.enable: true
      traefik.http.routers.qbittorrent.rule: "Host(`qbittorrent.${BASE_DOMAIN}`)"
      traefik.http.routers.qbittorrent.tls: "true"
      traefik.http.routers.qbittorrent.tls.certresolver: "cloudflare"
      traefik.http.routers.qbittorrent.middlewares: "tinyauth@docker"
      traefik.http.services.qbittorrent.loadbalancer.server.port: "8080"

  # Radarr - Gestor de películas
  radarr:
    image: ghcr.io/hotio/radarr:latest
    container_name: ${STACK_NAME}-radarr
    restart: unless-stopped
    networks:
      - proxy
      - media_internal
    volumes:
      - ${STACK_DATA}/config/radarr:/config
      - ${STACK_DATA}/library/movies:/media/library/movies
      - ${STACK_DATA}/downloads:/media/downloads
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
    labels:
      traefik.enable: true
      traefik.http.routers.radarr.rule: "Host(`radarr.${BASE_DOMAIN}`)"
      traefik.http.routers.radarr.tls: "true"
      traefik.http.routers.radarr.tls.certresolver: "cloudflare"
      traefik.http.routers.radarr.middlewares: "tinyauth@docker"
      traefik.http.services.radarr.loadbalancer.server.port: "7878"
    depends_on:
      - qbittorrent
      - prowlarr

  # Sonarr - Gestor de series
  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    container_name: ${STACK_NAME}-sonarr
    restart: unless-stopped
    networks:
      - proxy
      - media_internal
    volumes:
      - ${STACK_DATA}/config/sonarr:/config
      - ${STACK_DATA}/library/tv:/media/library/tv
      - ${STACK_DATA}/downloads:/media/downloads
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
    labels:
      traefik.enable: true
      traefik.http.routers.sonarr.rule: "Host(`sonarr.${BASE_DOMAIN}`)"
      traefik.http.routers.sonarr.tls: "true"
      traefik.http.routers.sonarr.tls.certresolver: "cloudflare"
      traefik.http.routers.sonarr.middlewares: "tinyauth@docker"
      traefik.http.services.sonarr.loadbalancer.server.port: "8989"
    depends_on:
      - qbittorrent
      - prowlarr

  # Prowlarr - Indexador (recomendado sobre Jackett)
  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    container_name: ${STACK_NAME}-prowlarr
    restart: unless-stopped
    networks:
      - proxy
      - media_internal
    volumes:
      - ${STACK_DATA}/config/prowlarr:/config
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
    labels:
      traefik.enable: true
      traefik.http.routers.prowlarr.rule: "Host(`prowlarr.${BASE_DOMAIN}`)"
      traefik.http.routers.prowlarr.tls: "true"
      traefik.http.routers.prowlarr.tls.certresolver: "cloudflare"
      traefik.http.routers.prowlarr.middlewares: "tinyauth@docker"
      traefik.http.services.prowlarr.loadbalancer.server.port: "9696"


  # Tdarr - Transcodificador de video
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: ${STACK_NAME}-tdarr
    restart: unless-stopped
    networks:
      - proxy
      - media_internal
    volumes:
      - ${STACK_DATA}/config/tdarr/server:/app/server
      - ${STACK_DATA}/config/tdarr:/app/configs
      - ${STACK_DATA}/config/tdarr/logs:/app/logs
      - ${STACK_DATA}/library:/media/library                    # RW - procesa archivos de medios
      - ${STACK_DATA}/downloads:/media/downloads              # RW - procesa descargas nuevas
      - ${STACK_DATA}/config/tdarr/temp:/temp
    ports:
      - '8266:8266'    # Puerto interno (opcional, para acceso directo de nodos sin proxy)
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - nodeID=MainNode
      - ffmpegVersion=6
      - nodeName=${STACK_NAME}_node
    labels:
      traefik.enable: true
      traefik.http.routers.tdarr.rule: "Host(`tdarr.${BASE_DOMAIN}`)"
      traefik.http.routers.tdarr.tls: "true"
      traefik.http.routers.tdarr.tls.certresolver: "cloudflare"
      traefik.http.routers.tdarr.middlewares: "tinyauth@docker"
      traefik.http.services.tdarr.loadbalancer.server.port: "8265"
    # Hardware acceleration configurado automáticamente via pre-deploy

  # Jackett - Agregador de trackers complementario a Prowlarr
  jackett:
    image: ghcr.io/hotio/jackett:latest
    container_name: ${STACK_NAME}-jackett
    restart: unless-stopped
    networks:
      - proxy
      - media_internal
    volumes:
      - ${STACK_DATA}/config/jackett:/config
      - ${STACK_DATA}/downloads/watch:/media/downloads/watch        # RW - deposita .torrents en watch folder
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
    labels:
      traefik.enable: true
      traefik.http.routers.jackett.rule: "Host(`jackett.${BASE_DOMAIN}`)"
      traefik.http.routers.jackett.tls: "true"
      traefik.http.routers.jackett.tls.certresolver: "cloudflare"
      traefik.http.routers.jackett.middlewares: "tinyauth@docker"
      traefik.http.services.jackett.loadbalancer.server.port: "9117"

  # Flaresolverr - Resuelve CloudFlare challenges para Prowlarr
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: ${STACK_NAME}-flaresolverr
    restart: unless-stopped
    networks:
      - media_internal
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    # No necesita proxy inverso (solo para uso interno)

networks:
  proxy:
    external: true
  media_internal:
    name: ${STACK_NAME}_network
