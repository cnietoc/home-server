[global]
host_root = "__REQUIRED__"
puid = "__REQUIRED__"
pgid = "__REQUIRED__"
tz = "__REQUIRED__"
domain = "__REQUIRED__"
log_level = "info"
notification_url = ""

[global.backups]
max_backups = 5
min_interval = "12h"

[infra.cloudflare]
email = "__REQUIRED__"
dns_api_token = "__REQUIRED__"

[infra.auth]
google_client_id = "__REQUIRED__"
google_client_secret = "__REQUIRED__"
oauth_whitelist = "__REQUIRED__"

[infra.backups]
exclude = [
    "*.log"
]

[jobs.update-dns]
description = "Actualizar DNS en Cloudflare"
plugin = "system:update-dns"
args = []
triggers = [
    { type = "startup", delay = "10s" },
    { type = "interval", interval = "30m" },
    # { type = "cron", cron = "*/15 * * * *" }
]

[jobs.backup-daily]
description = "Backup diario de todos los stacks e infra"
plugin = "system:backup"
enabled = true
args = []
triggers = [
    { type = "startup", delay = "1m" }, # Ejecutar 1 minuto después del inicio
    { type = "cron", cron = "0 3 * * *" }  # 03:00 cada día
]

[jobs.update-stacks]
description = "Actualizar imágenes de todos los stacks (excepto infra)"
plugin = "system:update-stacks"
enabled = true
args = []
triggers = [
    { type = "cron", cron = "0 2 * * *" }  # 02:00 cada día
]

[jobs.update-infra]
description = "Actualizar imágenes del stack de infraestructura"
plugin = "update"
enabled = true
args = ["infra"]
triggers = [
    { type = "cron", cron = "0 4 * * *" }  # 04:00 cada día
]

[media]
enable_intel_qsv = false
enable_nvidia = false
enable_vaapi = false

[media.backups]
exclude = [
    "/library",
    "/downloads",
    "/recordings",
    "/config/tdarr/server/Tdarr/Samples/",
    "/config/tdarr/server/Tdarr/DB2/JobReports/",
    "/config/tdarr/server/Tdarr/Backups/",
    "/config/qbittorrent/data/BT_backup/",
    "/config/prowlarr/Backups/",
    "/config/radarr/Backups/",
    "/config/sonarr/logs/",
    "/config/sonarr/Backups",
    "/config/jackett/*.txt",
    "/config/jellyfin/log/",
    "/config/jellyfin/temp/"
]

[home.backups]
enabled = false

[asf.backups]
exclude = [
    "/logs/"
]

[necesse]
motd = "Welcome to my Neccesse server!"
password = "__REQUIRED__"

[corekeeper]
world_name = "Home Server CoreKeeper Server"
game_id = ""
password = "__REQUIRED__"
discord_webhook_url = ""

[corekeeper.backups]
exclude = [
    "/server-files/"
]

[vrising]
server_name = "Home Server V Rising"
world_name = "world1"
gameport = "9876"
queryport = "9877"
password = "__REQUIRED__"
list_on_steam = "true"
list_on_eos = "true"
game_mode = "PvE"

[vrising.backups]
exclude = [
    "/server/"
]

[terraria]
world_name = "World"
world_size = "2"
difficulty = "0"
motd = "Welcome to my Terraria server!"
password = "__REQUIRED__"
max_players = "16"
secure = "1"
npcstream = "1"
language = "en-US"
modpack = "Default"
