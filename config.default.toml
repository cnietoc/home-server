[global]
host_root        = "__REQUIRED__"
puid             = "__REQUIRED__"
pgid             = "__REQUIRED__"
tz               = "__REQUIRED__"
domain           = "__REQUIRED__"
host_ip          = "__REQUIRED__"  # host LAN IP (auto-configured by `hms install`)
log_level        = "info"
notification_url = ""

[global.backups]
max_backups  = 5
min_interval = "12h"

[infra.cloudflare]
email         = "__REQUIRED__"
dns_api_token = "__REQUIRED__"

[infra.auth]
google_client_id     = "__REQUIRED__"
google_client_secret = "__REQUIRED__"
oauth_whitelist      = "__REQUIRED__"

[infra.backups]
exclude = ["*.log"]

[jobs.update-dns]
description = "Update DNS records in Cloudflare"
plugin      = "system:update-dns"
args        = []
triggers    = [
    { type = "startup",  delay    = "10s" },
    { type = "interval", interval = "30m" },
]

[jobs.backup-daily]
description = "Daily backup of all stacks and infra"
plugin      = "system:backup"
enabled     = true
args        = []
triggers    = [
    { type = "startup", delay = "1m"        },  # 1 minute after startup
    { type = "cron",    cron  = "0 3 * * *" },  # daily at 03:00
]

[router]
enabled         = true         # set false if UPnP is unavailable on the router
backend         = "upnp"       # "upnp" | "natpmp" | "none"
gateway_ip      = ""           # optional: router IP (e.g. "192.168.1.1"); empty = auto-detect
lease_duration  = "3600"       # lease duration in seconds (0 = permanent if supported by router)
exclude_stacks  = []           # stacks to manage manually (e.g. ["infra"])

[jobs.refresh-port-forwards]
description = "Refresh UPnP/NAT-PMP port-forwards on the router"
plugin      = "system:refresh-port-forwards"
enabled     = true
args        = []
triggers    = [
    { type = "startup",  delay    = "20s" },
    { type = "interval", interval = "30m" },
]

[jobs.update-stacks]
description = "Update images for all stacks (except infra)"
plugin      = "system:update-stacks"
enabled     = true
args        = []
triggers    = [
    { type = "cron", cron = "0 2 * * *" },  # daily at 02:00
]

[jobs.update-infra]
description = "Update infrastructure stack images"
plugin      = "update"
enabled     = true
args        = ["infra"]
triggers    = [
    { type = "cron", cron = "0 4 * * *" },  # daily at 04:00
]

[media]
enable_intel_qsv = false
enable_nvidia    = false
enable_vaapi     = false

[media.backups]
exclude = [
    "/library",
    "/downloads",
    "/recordings",
    "/config/tdarr/server/Tdarr/Samples/",
    "/config/tdarr/server/Tdarr/DB2/JobReports/",
    "/config/tdarr/server/Tdarr/Backups/",
    "/config/qbittorrent/data/BT_backup/",
    "/config/prowlarr/Backups/",
    "/config/radarr/Backups/",
    "/config/sonarr/logs/",
    "/config/sonarr/Backups",
    "/config/jackett/*.txt",
    "/config/jellyfin/log/",
    "/config/jellyfin/temp/",
]

[home.backups]
enabled = false

[pets.backups]
enabled = false

[asf.backups]
exclude = ["/logs/"]

[necesse]
motd     = "Welcome to my Neccesse server!"
password = "__REQUIRED__"

[corekeeper]
world_name          = "Home Server CoreKeeper Server"
game_id             = ""
password            = "__REQUIRED__"
discord_webhook_url = ""

[corekeeper.backups]
exclude = ["/server-files/"]

[vrising]
server_name            = "Home Server V Rising"
world_name             = "world1"
gameport               = "9876"
queryport              = "9877"
password               = "__REQUIRED__"
list_on_steam          = "true"
list_on_eos            = "true"
game_settings_preset   = "StandardPvE"        # StandardPvE | StandardPvE_Easy | StandardPvE_Hard | StandardPvP | StandardPvP_Easy | StandardPvP_Hard | SoloPvP | DuoPvP | HardcorePvP | HardcoreDuoPvP | Level30PvE | Level30PvP | Level50PvE | Level50PvP | Level70PvE | Level70PvP
game_difficulty_preset = "Difficulty_Normal"  # Difficulty_Easy | Difficulty_Normal | Difficulty_Brutal
teleport_bound_items   = false                # false = can teleport with resources
castle_decay_rate      = "0.1"                # minimum castle decay rate
blood_essence_drain    = "0.5"                # heart drains essence at half speed
material_yield         = "1.5"                # +50% material yield when farming
craft_rate             = "2.0"                # crafting 2x faster
refinement_rate        = "2.0"                # refining 2x faster
day_duration           = "720"                # day/night cycle duration in seconds (default: 1080)

[vrising.backups]
exclude = ["/server/"]

[terraria]
world_name  = "World"
world_size  = "2"           # 1=small, 2=medium, 3=large
difficulty  = "0"           # 0=normal, 1=expert, 2=master, 3=journey
motd        = "Welcome to my Terraria server!"
password    = "__REQUIRED__"
max_players = "16"
secure      = "1"
npcstream   = "1"
language    = "en-US"
modpack     = "Default"
