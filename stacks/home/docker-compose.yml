name: ${STACK_PREFIX}

networks:
  hms-network:
    external: true

x-hms:
  description: "Página principal del Home Server con información dinámica"

services:
  web:
    build: .
    container_name: ${STACK_PREFIX}
    restart: unless-stopped
    networks:
      - hms-network
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - HMS_API_URL=http://hms:8080
    labels:
      traefik.enable: true
      traefik.docker.network: "hms-network"
      traefik.http.routers.home.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.home.tls: "true"
      traefik.http.routers.home.tls.certresolver: "cloudflare"
      traefik.http.services.home.loadbalancer.server.port: "3000"
      # Excluir de Watchtower (imagen construida localmente)
      com.centurylinklabs.watchtower.enable: "false"
      hms.description: "🏠 Home Server Dashboard"
