name: ${STACK_PREFIX}

networks:
  hms-network:
    external: true

x-hms:
  description: "Página principal del Home Server con información dinámica"

services:
  web:
    build: .
    container_name: ${STACK_PREFIX}
    restart: unless-stopped
    networks:
      - hms-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - HMS_API_URL=http://hms:8080
    labels:
      traefik.enable: true
      traefik.docker.network: "hms-network"
      traefik.http.routers.home.rule: "Host(`${DOMAIN}`) && !PathPrefix(`/api/stacks`)"
      traefik.http.routers.home.tls: "true"
      traefik.http.routers.home.tls.certresolver: "cloudflare"
      traefik.http.routers.home.service: "home"
      traefik.http.routers.home-admin.rule: "Host(`${DOMAIN}`) && PathPrefix(`/api/stacks`)"
      traefik.http.routers.home-admin.tls: "true"
      traefik.http.routers.home-admin.tls.certresolver: "cloudflare"
      traefik.http.routers.home-admin.middlewares: "tinyauth@docker"
      traefik.http.routers.home-admin.service: "home"
      traefik.http.services.home.loadbalancer.server.port: "3000"
      # Excluir de Watchtower (imagen construida localmente)
      com.centurylinklabs.watchtower.enable: "false"
      hms.description: "🏠 Home Server Dashboard"
