<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 Home Server Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 300;
        }

        .header .subtitle {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 1rem;
        }

        .last-updated {
            font-size: 0.8rem;
            opacity: 0.6;
        }


        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card h2 {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .card h2 .icon {
            margin-right: 0.5rem;
            font-size: 1.5rem;
        }

        .system-info {
            display: grid;
            gap: 1rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .info-label {
            font-weight: 500;
            opacity: 0.9;
        }

        .info-value {
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .services-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .service-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .service-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .info-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .service-info {
            flex: 1;
            min-width: 0;
        }

        .service-name {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.2rem;
        }

        .service-url {
            font-size: 0.7rem;
            opacity: 0.7;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .stack-block {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stack-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .stack-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .stack-desc {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 0.25rem;
        }

        .stack-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-align: right;
        }

        .stack-counts {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .endpoint-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.35rem;
        }

        .endpoint-link {
            font-size: 0.7rem;
            color: #e0e7ff;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.15rem 0.4rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .endpoint-link:hover {
            background: rgba(0, 0, 0, 0.35);
        }

        .visibility-badge {
            margin-left: 0.5rem;
            font-size: 0.65rem;
            padding: 0.15rem 0.4rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .visibility-public {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }

        .visibility-private {
            background: rgba(249, 115, 22, 0.15);
            color: #f97316;
        }

        .status-indicator {
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-low {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-medium {
            background: rgba(249, 115, 22, 0.2);
            color: #f97316;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }

        .status-high {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }


        .loading {
            text-align: center;
            padding: 2rem;
            opacity: 0.7;
        }

        .error {
            text-align: center;
            padding: 2rem;
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 15px;
            color: #dc3545;
            margin: 2rem 0;
        }


        .stack-metrics {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 0.6rem;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .metric-spark-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.7rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .metric-label {
            opacity: 0.65;
            min-width: 2rem;
        }

        .metric-value {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            min-width: 4.5rem;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="header">
        <h1>🏠 Home Server</h1>
        <p class="subtitle">Resumen del sistema y servicios activos</p>
        <div class="last-updated" id="lastUpdated">Cargando...</div>
    </div>

        <!-- Estado del Sistema -->
        <div class="card">
            <h2><span class="icon">📊</span> Estado del Sistema</h2>
            <div class="system-info" id="systemInfo">
                <div class="loading">Cargando información del sistema...</div>
            </div>
        </div>

        <!-- Stacks y servicios -->
        <div class="card">
            <h2><span class="icon">🧩</span> Stacks y servicios</h2>
            <div class="services-container" id="stacksContainer">
                <div class="loading">Cargando servicios...</div>
            </div>
        </div>
    </div>

    <script>
        const BUFFER_SIZE = 60;
        const metricsBuffer = {};

        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' B/s';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB/s';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB/s';
        }

        function sparkline(values, color) {
            if (values.length < 2) return `<svg width="80" height="24"></svg>`;
            const w = 80, h = 24;
            const max = Math.max(...values, 0.001);
            const points = values.map((v, i) => {
                const x = (i / (values.length - 1)) * w;
                const y = h - (v / max) * (h - 2) - 1;
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');
            return `<svg width="${w}" height="${h}" style="display:block">` +
                `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>` +
                `</svg>`;
        }

        function updateMetricsBuffer(metrics) {
            for (const [stack, data] of Object.entries(metrics)) {
                if (!metricsBuffer[stack]) {
                    metricsBuffer[stack] = { cpu: [], memory: [], net: [] };
                }
                const buf = metricsBuffer[stack];
                buf.cpu.push(data.cpu_percent);
                buf.memory.push(data.memory_mb);
                buf.net.push(data.net_rx + data.net_tx);
                if (buf.cpu.length > BUFFER_SIZE) { buf.cpu.shift(); buf.memory.shift(); buf.net.shift(); }
            }
        }

        function renderStackMetrics(stackName) {
            const buf = metricsBuffer[stackName];
            if (!buf || buf.cpu.length === 0) return '<div class="stack-metrics"></div>';
            const cpu = buf.cpu[buf.cpu.length - 1];
            const mem = buf.memory[buf.memory.length - 1];
            const net = buf.net[buf.net.length - 1];
            const lastData = Object.values(metricsBuffer[stackName]);
            return `
                <div id="stack-metrics-${stackName}" class="stack-metrics">
                    <span class="metric-spark-item">
                        <span class="metric-label">CPU</span>
                        ${sparkline(buf.cpu, '#a5b4fc')}
                        <span class="metric-value">${cpu}%</span>
                    </span>
                    <span class="metric-spark-item">
                        <span class="metric-label">RAM</span>
                        ${sparkline(buf.memory, '#6ee7b7')}
                        <span class="metric-value">${mem} MB</span>
                    </span>
                    <span class="metric-spark-item">
                        <span class="metric-label">NET</span>
                        ${sparkline(buf.net, '#67e8f9')}
                        <span class="metric-value">${formatBytes(net)}</span>
                    </span>
                </div>
            `;
        }

        function refreshMetricsDom() {
            for (const stackName of Object.keys(metricsBuffer)) {
                const el = document.getElementById(`stack-metrics-${stackName}`);
                if (!el) continue;
                el.outerHTML = renderStackMetrics(stackName);
            }
        }

        // Función para formatear fechas
        function formatDate(dateString) {
            const date = typeof dateString === 'number'
                ? new Date(dateString * 1000)
                : new Date(dateString);
            return date.toLocaleString('es-ES', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function getStatusBadge(state) {
            const statusMap = {
                running: { class: 'status-low', text: '🟢 Activo' },
                partial: { class: 'status-medium', text: '🟡 Parcial' },
                stopped: { class: 'status-high', text: '🔴 Parado' },
                'not-found': { class: 'status-medium', text: '⚪ Sin datos' }
            };
            return statusMap[state] || { class: 'status-medium', text: `⚪ ${state}` };
        }

        // Función para renderizar información del sistema
        function renderSystemInfo(system) {
            const container = document.getElementById('systemInfo');

            container.innerHTML = `
                <div class="info-item">
                    <span class="info-label">Servidor</span>
                    <span class="info-value">${system.server_name}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Tiempo Activo</span>
                    <span class="info-value">${system.uptime}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Memoria</span>
                    <div class="info-value">
                        ${system.memory.usage_percent}%
                        <span class="status-indicator status-${system.memory.status}">${system.memory.status}</span>
                    </div>
                </div>
                <div class="info-item">
                    <span class="info-label">Disco</span>
                    <div class="info-value">
                        ${system.disk.usage_percent}% usado
                        <span class="status-indicator status-${system.disk.status}">${system.disk.status}</span>
                    </div>
                </div>
                <div class="info-item">
                    <span class="info-label">Carga del Sistema</span>
                    <div class="info-value">
                        ${system.load.value}
                        <span class="status-indicator status-${system.load.status}">${system.load.status}</span>
                    </div>
                </div>
                <div class="info-item">
                    <span class="info-label">Stacks</span>
                    <span class="info-value">${system.totals.stacks}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Contenedores</span>
                    <span class="info-value">
                        Activos: ${system.totals.containers.running} |
                        Parados: ${system.totals.containers.stopped} |
                        Total: ${system.totals.containers.total}
                    </span>
                </div>
            `;
        }

        function renderStacks(stacks) {
            const container = document.getElementById('stacksContainer');

            if (!stacks || stacks.length === 0) {
                container.innerHTML = '<div class="info-item"><span class="info-label">No hay stacks disponibles</span></div>';
                return;
            }

            container.innerHTML = stacks.map(stack => {
                const status = getStatusBadge(stack.status);
                const services = stack.services || [];
                return `
                    <div class="stack-block">
                        <div class="stack-header">
                            <div>
                                <div class="stack-title">${stack.name}</div>
                                <div class="stack-desc">${stack.description || ''}</div>
                            </div>
                            <div class="stack-meta">
                                <span class="status-indicator ${status.class}">${status.text}</span>
                                <span class="stack-counts">
                                    Activos: ${stack.containers.running} |
                                    Parados: ${stack.containers.stopped} |
                                    Total: ${stack.containers.total}
                                </span>
                            </div>
                        </div>
                        ${renderStackMetrics(stack.name)}
                        <div class="services-container">
                            ${services.length ? services.map(service => {
                                const serviceStatus = getStatusBadge(service.state);
                                const visibilityClass = service.public ? 'visibility-public' : 'visibility-private';
                                const visibilityText = service.public ? 'publico' : 'protegido';
                                const showVisibility = service.has_endpoint;
                                return `
                                    <div class="service-item">
                                        <div class="service-info">
                                            <div class="service-name">
                                                ${service.name}
                                                ${showVisibility ? `<span class="visibility-badge ${visibilityClass}">${visibilityText}</span>` : ''}
                                            </div>
                                            <div class="service-url">${service.description || ''}</div>
                                            <div class="endpoint-list">
                                                ${(service.endpoints || []).length ? (service.endpoints || []).map(endpoint => `
                                                    <a class="endpoint-link" href="${endpoint.url}" target="_blank" rel="noreferrer">${endpoint.host}</a>
                                                `).join('') : '<span class="service-url">Sin endpoint accesible</span>'}
                                            </div>
                                        </div>
                                        <span class="status-indicator ${serviceStatus.class}">${serviceStatus.text}</span>
                                    </div>
                                `;
                            }).join('') : '<div class="info-item"><span class="info-label">Sin servicios</span></div>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                document.getElementById('lastUpdated').textContent =
                    `Última actualización: ${formatDate(data.generated_at)}`;
                renderSystemInfo(data.system);
                renderStacks(data.stacks);
            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('systemInfo').innerHTML =
                    '<div class="error">Error cargando información del sistema</div>';
                document.getElementById('stacksContainer').innerHTML =
                    '<div class="error">Error cargando servicios</div>';
            }
        }

        async function loadMetrics() {
            try {
                const res = await fetch('/api/metrics');
                if (!res.ok) return;
                const metrics = await res.json();
                updateMetricsBuffer(metrics);
                refreshMetricsDom();
            } catch (error) {
                console.error('Error loading metrics:', error);
            }
        }

        loadDashboard();
        loadMetrics();

        setInterval(loadDashboard, 60000);
        setInterval(loadMetrics, 10000);
    </script>
</body>
</html>
