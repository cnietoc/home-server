<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 Home Server Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 300;
        }

        .header .subtitle {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 1rem;
        }

        .last-updated {
            font-size: 0.8rem;
            opacity: 0.6;
        }


        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card h2 {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .card h2 .icon {
            margin-right: 0.5rem;
            font-size: 1.5rem;
        }

        .system-info {
            display: grid;
            gap: 1rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .info-label {
            font-weight: 500;
            opacity: 0.9;
        }

        .info-value {
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .services-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .service-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .service-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .info-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .service-info {
            flex: 1;
            min-width: 0;
        }

        .service-name {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.2rem;
        }

        .service-url {
            font-size: 0.7rem;
            opacity: 0.7;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .stack-block {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stack-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .stack-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .stack-desc {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 0.25rem;
        }

        .stack-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-align: right;
        }

        .stack-counts {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .endpoint-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.35rem;
        }

        .endpoint-link {
            font-size: 0.7rem;
            color: #e0e7ff;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.15rem 0.4rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .endpoint-link:hover {
            background: rgba(0, 0, 0, 0.35);
        }

        .visibility-badge {
            margin-left: 0.5rem;
            font-size: 0.65rem;
            padding: 0.15rem 0.4rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .visibility-public {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }

        .visibility-private {
            background: rgba(249, 115, 22, 0.15);
            color: #f97316;
        }

        .status-indicator {
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-low {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-medium {
            background: rgba(249, 115, 22, 0.2);
            color: #f97316;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }

        .status-high {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }


        .loading {
            text-align: center;
            padding: 2rem;
            opacity: 0.7;
        }

        .error {
            text-align: center;
            padding: 2rem;
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 15px;
            color: #dc3545;
            margin: 2rem 0;
        }

        .refresh-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 1rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinning {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="header">
        <h1>🏠 Home Server</h1>
        <p class="subtitle">Resumen del sistema y servicios activos</p>
        <div class="last-updated" id="lastUpdated">Cargando...</div>
    </div>

        <!-- Estado del Sistema -->
        <div class="card">
            <h2><span class="icon">📊</span> Estado del Sistema</h2>
            <div class="system-info" id="systemInfo">
                <div class="loading">Cargando información del sistema...</div>
            </div>
        </div>

        <!-- Stacks y servicios -->
        <div class="card">
            <h2><span class="icon">🧩</span> Stacks y servicios</h2>
            <div class="services-container" id="stacksContainer">
                <div class="loading">Cargando servicios...</div>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadDashboard()" title="Actualizar">
        <span id="refreshIcon">🔄</span>
    </button>

    <script>
        // Función para formatear fechas
        function formatDate(dateString) {
            const date = typeof dateString === 'number'
                ? new Date(dateString * 1000)
                : new Date(dateString);
            return date.toLocaleString('es-ES', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function getStatusBadge(state) {
            const statusMap = {
                running: { class: 'status-low', text: '🟢 On' },
                partial: { class: 'status-medium', text: '🟡 Parcial' },
                stopped: { class: 'status-high', text: '🔴 Off' },
                'not-found': { class: 'status-medium', text: '⚪ N/A' }
            };
            return statusMap[state] || { class: 'status-medium', text: `⚪ ${state}` };
        }

        // Función para renderizar información del sistema
        function renderSystemInfo(system) {
            const container = document.getElementById('systemInfo');

            container.innerHTML = `
                <div class="info-item">
                    <span class="info-label">Servidor</span>
                    <span class="info-value">${system.server_name}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Tiempo Activo</span>
                    <span class="info-value">${system.uptime}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Memoria</span>
                    <div class="info-value">
                        ${system.memory.usage_percent}%
                        <span class="status-indicator status-${system.memory.status}">${system.memory.status}</span>
                    </div>
                </div>
                <div class="info-item">
                    <span class="info-label">Disco</span>
                    <div class="info-value">
                        ${system.disk.usage_percent}% usado
                        <span class="status-indicator status-${system.disk.status}">${system.disk.status}</span>
                    </div>
                </div>
                <div class="info-item">
                    <span class="info-label">Carga del Sistema</span>
                    <div class="info-value">
                        ${system.load.value}
                        <span class="status-indicator status-${system.load.status}">${system.load.status}</span>
                    </div>
                </div>
                <div class="info-item">
                    <span class="info-label">Stacks</span>
                    <span class="info-value">${system.totals.stacks}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Contenedores</span>
                    <span class="info-value">
                        ${system.totals.containers.running} on /
                        ${system.totals.containers.stopped} off /
                        ${system.totals.containers.total} total
                    </span>
                </div>
            `;
        }

        function renderStacks(stacks) {
            const container = document.getElementById('stacksContainer');

            if (!stacks || stacks.length === 0) {
                container.innerHTML = '<div class="info-item"><span class="info-label">No hay stacks disponibles</span></div>';
                return;
            }

            container.innerHTML = stacks.map(stack => {
                const status = getStatusBadge(stack.status);
                const services = stack.services || [];
                return `
                    <div class="stack-block">
                        <div class="stack-header">
                            <div>
                                <div class="stack-title">${stack.name}</div>
                                <div class="stack-desc">${stack.description || ''}</div>
                            </div>
                            <div class="stack-meta">
                                <span class="status-indicator ${status.class}">${status.text}</span>
                                <span class="stack-counts">
                                    ${stack.containers.running} on /
                                    ${stack.containers.stopped} off /
                                    ${stack.containers.total} total
                                </span>
                            </div>
                        </div>
                        <div class="services-container">
                            ${services.length ? services.map(service => {
                                const serviceStatus = getStatusBadge(service.state);
                                const visibilityClass = service.public ? 'visibility-public' : 'visibility-private';
                                const visibilityText = service.public ? 'publico' : 'protegido';
                                return `
                                    <div class="service-item">
                                        <div class="service-info">
                                            <div class="service-name">
                                                ${service.name}
                                                <span class="visibility-badge ${visibilityClass}">${visibilityText}</span>
                                            </div>
                                            <div class="service-url">${service.description || ''}</div>
                                            <div class="endpoint-list">
                                                ${(service.endpoints || []).map(endpoint => `
                                                    <a class="endpoint-link" href="${endpoint.url}" target="_blank" rel="noreferrer">${endpoint.host}</a>
                                                `).join('')}
                                            </div>
                                        </div>
                                        <span class="status-indicator ${serviceStatus.class}">${serviceStatus.text}</span>
                                    </div>
                                `;
                            }).join('') : '<div class="info-item"><span class="info-label">Sin servicios</span></div>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Función para cargar el dashboard
        async function loadDashboard() {
            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.classList.add('spinning');

            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();

                // Actualizar timestamp
                document.getElementById('lastUpdated').textContent =
                    `Última actualización: ${formatDate(data.generated_at)}`;

                // Renderizar componentes
                renderSystemInfo(data.system);
                renderStacks(data.stacks);

            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('systemInfo').innerHTML =
                    '<div class="error">Error cargando información del sistema</div>';
                document.getElementById('stacksContainer').innerHTML =
                    '<div class="error">Error cargando servicios</div>';
            } finally {
                refreshIcon.classList.remove('spinning');
            }
        }

        // Cargar dashboard al inicio
        loadDashboard();

        // Actualizar cada 30 segundos
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
