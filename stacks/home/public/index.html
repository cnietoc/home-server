<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Server</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { font-size: 17px; }

        :root {
            --bg:       #09090b;
            --surface:  #111116;
            --surface2: #18181e;
            --border:   #1e1e2a;
            --text:     #e2e2ea;
            --muted:    #6b6b7e;
            --accent:   #818cf8;
            --green:    #34d399;
            --amber:    #fbbf24;
            --red:      #f87171;
            --cyan:     #67e8f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(rgba(129,140,248,0.06) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text);
        }

        .header-title span { color: var(--accent); }

        #lastUpdated {
            font-size: 0.72rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        /* ── Section ── */
        .section-label {
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }

        /* ── Stats grid ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.625rem;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.875rem 1rem;
        }

        .stat-label {
            font-size: 0.68rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 0.35rem;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .stat-sub {
            font-size: 0.68rem;
            color: var(--muted);
            margin-top: 0.15rem;
        }

        .stat-value.warn  { color: var(--amber); }
        .stat-value.crit  { color: var(--red);   }

        /* ── Stack list ── */
        .stack-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stack-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .stack-card.running  { border-left-color: var(--green); }
        .stack-card.partial  { border-left-color: var(--amber); }
        .stack-card.stopped  { border-left-color: var(--red);   }

        .stack-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.875rem 1rem;
            gap: 1rem;
        }

        .stack-name {
            font-size: 0.875rem;
            font-weight: 600;
        }

        .stack-desc-text {
            font-size: 0.72rem;
            color: var(--muted);
            margin-top: 0.1rem;
        }

        .stack-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.running   { background: var(--green); box-shadow: 0 0 5px var(--green); }
        .status-dot.partial   { background: var(--amber); box-shadow: 0 0 5px var(--amber); }
        .status-dot.stopped   { background: var(--red);   }
        .status-dot.not-found { background: var(--muted); }

        .container-counts {
            font-size: 0.68rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        /* ── Metrics strip ── */
        .stack-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            padding: 0 1rem 0.75rem;
        }

        .metric-spark-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.68rem;
            background: var(--surface2);
            padding: 0.2rem 0.5rem;
            border-radius: 5px;
            border: 1px solid var(--border);
        }

        .metric-label {
            color: var(--muted);
            min-width: 2rem;
        }

        .metric-value {
            font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
            font-weight: 500;
            min-width: 4.5rem;
            text-align: right;
        }

        /* ── Services ── */
        .services-list { border-top: 1px solid var(--border); }

        .service-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.55rem 1rem;
            border-bottom: 1px solid var(--border);
            gap: 1rem;
            transition: background 0.15s;
        }
        .service-row:last-child { border-bottom: none; }
        .service-row:hover { background: var(--surface2); }

        .service-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 0;
        }

        .service-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .service-dot.running   { background: var(--green); }
        .service-dot.partial   { background: var(--amber); }
        .service-dot.stopped   { background: var(--red);   }
        .service-dot.not-found { background: var(--muted); }

        .service-name {
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .service-desc {
            font-size: 0.7rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .service-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .endpoint-link {
            font-size: 0.68rem;
            color: var(--accent);
            text-decoration: none;
            font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            border: 1px solid rgba(129,140,248,0.2);
            background: rgba(129,140,248,0.06);
            white-space: nowrap;
            transition: background 0.15s;
        }
        .endpoint-link:hover { background: rgba(129,140,248,0.14); }

        .visibility-badge {
            font-size: 0.6rem;
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
        }
        .visibility-public  { background: rgba(52,211,153,0.1); color: var(--green); }
        .visibility-private { background: rgba(107,107,126,0.12); color: var(--muted); }

        /* ── Available stacks ── */
        .available-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .available-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.875rem;
        }

        .available-name {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .available-desc {
            font-size: 0.68rem;
            color: var(--muted);
        }

        /* ── Stack control buttons ── */
        .stack-btn {
            font-size: 0.75rem;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--muted);
            text-decoration: none;
            line-height: 1.6;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
            cursor: pointer;
        }
        .stack-btn.start:hover { border-color: var(--green); color: var(--green); background: rgba(52,211,153,0.06); }
        .stack-btn.stop:hover  { border-color: var(--red);   color: var(--red);   background: rgba(248,113,113,0.06); }
        .stack-btn.pending     { pointer-events: none; opacity: 0.5; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .stack-btn.pending::after { content: '⟳'; display: inline-block; animation: spin 1s linear infinite; }

        /* ── Misc ── */
        .loading  { padding: 2rem; text-align: center; color: var(--muted); font-size: 0.8rem; }
        .error-msg {
            padding: 1rem; color: var(--red); font-size: 0.8rem;
            background: rgba(248,113,113,0.06);
            border: 1px solid rgba(248,113,113,0.2);
            border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="header-title">Home <span>//</span> Server</div>
        <div id="lastUpdated">—</div>
    </header>

    <section>
        <div class="section-label">Sistema</div>
        <div class="stats-grid" id="systemInfo">
            <div class="loading">Cargando...</div>
        </div>
    </section>

    <section>
        <div class="section-label">Stacks</div>
        <div class="stack-list" id="stacksContainer">
            <div class="loading">Cargando...</div>
        </div>
    </section>

    <section id="availableSection" style="display:none">
        <div class="section-label">Arrancar</div>
        <div class="available-grid" id="availableContainer"></div>
    </section>
</div>

<script>
    const BUFFER_SIZE = 60;
    const metricsBuffer = {};

    function formatBytes(bytes) {
        if (bytes < 1024) return bytes + ' B/s';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB/s';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB/s';
    }

    function formatDate(ts) {
        const date = typeof ts === 'number' ? new Date(ts * 1000) : new Date(ts);
        return date.toLocaleString('es-ES', {
            day: '2-digit', month: 'short',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
    }

    function sparkline(values, color) {
        if (values.length < 2) return `<svg width="120" height="28"></svg>`;
        const w = 120, h = 28;
        const max = Math.max(...values, 0.001);
        const points = values.map((v, i) => {
            const x = (i / (values.length - 1)) * w;
            const y = h - (v / max) * (h - 2) - 1;
            return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(' ');
        return `<svg width="${w}" height="${h}" style="display:block">` +
            `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>` +
            `</svg>`;
    }

    function updateMetricsBuffer(metrics) {
        for (const [stack, data] of Object.entries(metrics)) {
            if (!metricsBuffer[stack]) metricsBuffer[stack] = { cpu: [], memory: [], net: [] };
            const buf = metricsBuffer[stack];
            buf.cpu.push(data.cpu_percent);
            buf.memory.push(data.memory_mb);
            buf.net.push(data.net_rx + data.net_tx);
            if (buf.cpu.length > BUFFER_SIZE) { buf.cpu.shift(); buf.memory.shift(); buf.net.shift(); }
        }
    }

    function renderStackMetrics(stackName) {
        const buf = metricsBuffer[stackName];
        if (!buf || buf.cpu.length === 0) return `<div id="stack-metrics-${stackName}" class="stack-metrics"></div>`;
        const cpu = buf.cpu[buf.cpu.length - 1];
        const mem = buf.memory[buf.memory.length - 1];
        const net = buf.net[buf.net.length - 1];
        return `
            <div id="stack-metrics-${stackName}" class="stack-metrics">
                <span class="metric-spark-item">
                    <span class="metric-label">CPU</span>
                    ${sparkline(buf.cpu, '#a5b4fc')}
                    <span class="metric-value">${cpu}%</span>
                </span>
                <span class="metric-spark-item">
                    <span class="metric-label">RAM</span>
                    ${sparkline(buf.memory, '#6ee7b7')}
                    <span class="metric-value">${mem} MB</span>
                </span>
                <span class="metric-spark-item">
                    <span class="metric-label">NET</span>
                    ${sparkline(buf.net, '#67e8f9')}
                    <span class="metric-value">${formatBytes(net)}</span>
                </span>
            </div>
        `;
    }

    function refreshMetricsDom() {
        for (const stackName of Object.keys(metricsBuffer)) {
            const el = document.getElementById(`stack-metrics-${stackName}`);
            if (el) el.outerHTML = renderStackMetrics(stackName);
        }
    }

    function statusClass(state) {
        return { running: 'running', partial: 'partial', stopped: 'stopped' }[state] || 'not-found';
    }

    function renderSystemInfo(system) {
        const mem = system.memory;
        const disk = system.disk;
        const load = system.load;
        const memClass = mem.status === 'high' ? 'crit' : mem.status === 'medium' ? 'warn' : '';
        const diskClass = disk.status === 'high' ? 'crit' : disk.status === 'medium' ? 'warn' : '';
        const loadClass = load.status === 'high' ? 'crit' : load.status === 'medium' ? 'warn' : '';

        document.getElementById('systemInfo').innerHTML = `
            <div class="stat-card">
                <div class="stat-label">Uptime</div>
                <div class="stat-value">${system.uptime}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Carga</div>
                <div class="stat-value ${loadClass}">${load.value}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Memoria</div>
                <div class="stat-value ${memClass}">${mem.usage_percent}%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Disco</div>
                <div class="stat-value ${diskClass}">${disk.usage_percent}%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Stacks</div>
                <div class="stat-value">${system.totals.stacks}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Contenedores</div>
                <div class="stat-value">${system.totals.containers.running}</div>
                <div class="stat-sub">de ${system.totals.containers.total} activos</div>
            </div>
        `;
    }

    function renderStacks(stacks) {
        const container = document.getElementById('stacksContainer');
        if (!stacks || stacks.length === 0) {
            container.innerHTML = '<div class="error-msg">No hay stacks disponibles</div>';
            return;
        }

        container.innerHTML = stacks.map(stack => {
            const sc = statusClass(stack.status);
            const services = (stack.services || []).slice().sort((a, b) => (b.public ? 1 : 0) - (a.public ? 1 : 0));
            return `
                <div class="stack-card ${sc}">
                    <div class="stack-head">
                        <div>
                            <div class="stack-name">${stack.name}</div>
                            ${stack.description ? `<div class="stack-desc-text">${stack.description}</div>` : ''}
                        </div>
                        <div class="stack-right">
                            <span class="container-counts">${stack.containers.running}/${stack.containers.total}</span>
                            ${!['infra','home'].includes(stack.name) ? `<a class="stack-btn stop" onclick="controlStack('${stack.name}','down',this)">■</a>` : ''}
                            <span class="status-dot ${sc}"></span>
                        </div>
                    </div>
                    ${renderStackMetrics(stack.name)}
                    ${services.length ? `
                        <div class="services-list">
                            ${services.map(svc => {
                                const sc2 = statusClass(svc.state);
                                const vis = svc.public ? 'public' : 'private';
                                const visText = svc.public ? 'público' : 'auth';
                                return `
                                    <div class="service-row">
                                        <div class="service-left">
                                            <span class="service-dot ${sc2}"></span>
                                            <div>
                                                <div class="service-name">${svc.name}</div>
                                                ${svc.description ? `<div class="service-desc">${svc.description}</div>` : ''}
                                            </div>
                                        </div>
                                        <div class="service-right">
                                            ${(svc.endpoints || []).map(e => `
                                                <a class="endpoint-link" href="${e.url}" target="_blank" rel="noreferrer">${e.host}</a>
                                            `).join('')}
                                            ${svc.has_endpoint ? `<span class="visibility-badge visibility-${vis}">${visText}</span>` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }

    async function controlStack(name, action, btn) {
        const label = action === 'up' ? 'Arrancar' : 'Parar';
        if (!confirm(`¿${label} ${name}?`)) return;

        const originalText = btn.textContent;
        btn.textContent = '';
        btn.classList.add('pending');

        const url = `/api/stacks/${name}/${action}`;
        try {
            const res = await fetch(url, {
                headers: { 'X-HMS-Control': '1' },
                redirect: 'manual',
            });
            if (res.type === 'opaqueredirect') {
                window.location.href = url;
                return;
            }
        } catch (_) {}

        btn.textContent = originalText;
        btn.classList.remove('pending');
        await loadDashboard();
    }

    function renderAvailable(available) {
        const section = document.getElementById('availableSection');
        const container = document.getElementById('availableContainer');
        if (!available || available.length === 0) {
            section.style.display = 'none';
            return;
        }
        section.style.display = '';
        container.innerHTML = available.map(s => `
            <div class="available-item">
                <div>
                    <div class="available-name">${s.name}</div>
                    ${s.description ? `<div class="available-desc">${s.description}</div>` : ''}
                </div>
                <a class="stack-btn start" onclick="controlStack('${s.name}','up',this)">▶</a>
            </div>
        `).join('');
    }

    async function loadDashboard() {
        try {
            const res = await fetch('/api/dashboard');
            const data = await res.json();
            document.getElementById('lastUpdated').textContent = formatDate(data.generated_at);
            renderSystemInfo(data.system);
            const PINNED = ['infra', 'home'];
            const sorted = [...data.stacks].sort((a, b) => {
                const ai = PINNED.indexOf(a.name), bi = PINNED.indexOf(b.name);
                if (ai !== -1 && bi !== -1) return ai - bi;
                if (ai !== -1) return -1;
                if (bi !== -1) return 1;
                return 0;
            });
            renderStacks(sorted);
            renderAvailable(data.available);
        } catch (e) {
            console.error('Error loading dashboard:', e);
            document.getElementById('systemInfo').innerHTML = '<div class="error-msg">Error cargando el sistema</div>';
            document.getElementById('stacksContainer').innerHTML = '<div class="error-msg">Error cargando stacks</div>';
        }
    }

    async function loadMetrics() {
        try {
            const res = await fetch('/api/metrics');
            if (!res.ok) return;
            updateMetricsBuffer(await res.json());
            refreshMetricsDom();
        } catch (e) {
            console.error('Error loading metrics:', e);
        }
    }

    loadDashboard();
    loadMetrics();

    setInterval(loadDashboard, 60000);
    setInterval(loadMetrics, 10000);
</script>
</body>
</html>
