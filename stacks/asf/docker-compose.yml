name: ${STACK_PREFIX}

networks:
  hms-network:
    external: true

x-hms:
  description: "ArchiSteamFarm - Farmeo automático de cromos de Steam"

services:
  asf:
    image: justarchi/archisteamfarm:latest
    container_name: ${STACK_PREFIX}
    restart: unless-stopped
    networks:
      - hms-network
    volumes:
      # Almacenamiento en data/steam/
      - ${STACK_DATA}/config:/app/config
      - ${STACK_DATA}/logs:/app/logs
      - ${STACK_DATA}/cache:/app/cache
    environment:
      # Variables básicas
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    labels:
      # Traefik routing
      traefik.enable: "true"
      traefik.http.routers.asf.rule: "Host(`asf.${DOMAIN}`)"
      traefik.http.routers.asf.tls: "true"
      traefik.http.routers.asf.tls.certresolver: "cloudflare"
      traefik.http.routers.asf.middlewares: "tinyauth@docker"
      traefik.http.services.asf.loadbalancer.server.port: "1242"
      hms.description: "🎮 ArchiSteamFarm - Farmeo de cromos"
