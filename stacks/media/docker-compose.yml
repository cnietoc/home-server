name: ${STACK_PREFIX}

networks:
  hms-network:
    external: true
  media_internal:
    name: ${STACK_PREFIX}-network

x-hms:
  description: "Suite completa de medios: descargas, gestión y streaming"
  public_ports:
    - { port: 6881, protocol: tcp, description: "qBittorrent peer port" }
    - { port: 6881, protocol: udp, description: "qBittorrent peer port" }

services:
  # Jellyfin - Servidor de medios
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:latest
    container_name: ${STACK_PREFIX}-jellyfin
    restart: unless-stopped
    networks:
      - hms-network
      - media_internal
    volumes:
      - ${STACK_DATA}/config/jellyfin:/config
      - ${STACK_DATA}/config/jellyfin/temp:/cache
      - ${STACK_DATA}/library:/media/library:ro
      - ${STACK_DATA}/recordings:/media/recordings/:rw
      - ${STACK_DATA}/downloads/complete:/media/downloads/complete:ro
    ports:
      - "8096:8096"       # Puerto interno (opcional, para acceso directo sin proxy)
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - JELLYFIN_CACHE_DIR=/cache
      - JELLYFIN_PublishedServerUrl=https://jellyfin.${DOMAIN}
    labels:
      traefik.enable: true
      traefik.docker.network: "hms-network"
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.${DOMAIN}`)"
      traefik.http.routers.jellyfin.tls: "true"
      traefik.http.routers.jellyfin.tls.certresolver: "cloudflare"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
      hms.description: "🎬 Servidor de medios Jellyfin"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # qBittorrent - Cliente BitTorrent
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:latest
    container_name: ${STACK_PREFIX}-qbittorrent
    restart: unless-stopped
    stop_grace_period: 120s
    networks:
      - hms-network
      - media_internal
    volumes:
      - ${STACK_DATA}/config/qbittorrent:/config
      - ${STACK_DATA}/downloads:/media/downloads
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - WEBUI_PORT=8080
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    labels:
      traefik.enable: true
      traefik.docker.network: "hms-network"
      traefik.http.routers.qbittorrent.rule: "Host(`qbittorrent.${DOMAIN}`)"
      traefik.http.routers.qbittorrent.tls: "true"
      traefik.http.routers.qbittorrent.tls.certresolver: "cloudflare"
      traefik.http.routers.qbittorrent.middlewares: "tinyauth@docker"
      traefik.http.services.qbittorrent.loadbalancer.server.port: "8080"
      hms.description: "⬇️ Cliente BitTorrent"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/app/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Radarr - Gestor de películas
  radarr:
    image: ghcr.io/hotio/radarr:latest
    container_name: ${STACK_PREFIX}-radarr
    restart: unless-stopped
    networks:
      - hms-network
      - media_internal
    volumes:
      - ${STACK_DATA}/config/radarr:/config
      - ${STACK_DATA}/library/movies:/media/library/movies
      - ${STACK_DATA}/downloads:/media/downloads
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
    labels:
      traefik.enable: true
      traefik.docker.network: "hms-network"
      traefik.http.routers.radarr.rule: "Host(`radarr.${DOMAIN}`)"
      traefik.http.routers.radarr.tls: "true"
      traefik.http.routers.radarr.tls.certresolver: "cloudflare"
      traefik.http.routers.radarr.middlewares: "tinyauth@docker"
      traefik.http.services.radarr.loadbalancer.server.port: "7878"
      hms.description: "🎥 Gestor de películas Radarr"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      qbittorrent:
        condition: service_healthy
      prowlarr:
        condition: service_healthy

  # Sonarr - Gestor de series
  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    container_name: ${STACK_PREFIX}-sonarr
    restart: unless-stopped
    networks:
      - hms-network
      - media_internal
    volumes:
      - ${STACK_DATA}/config/sonarr:/config
      - ${STACK_DATA}/library/tv:/media/library/tv
      - ${STACK_DATA}/downloads:/media/downloads
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
    labels:
      traefik.enable: true
      traefik.docker.network: "hms-network"
      traefik.http.routers.sonarr.rule: "Host(`sonarr.${DOMAIN}`)"
      traefik.http.routers.sonarr.tls: "true"
      traefik.http.routers.sonarr.tls.certresolver: "cloudflare"
      traefik.http.routers.sonarr.middlewares: "tinyauth@docker"
      traefik.http.services.sonarr.loadbalancer.server.port: "8989"
      hms.description: "📺 Gestor de series Sonarr"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      qbittorrent:
        condition: service_healthy
      prowlarr:
        condition: service_healthy

  # Prowlarr - Indexador (recomendado sobre Jackett)
  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    container_name: ${STACK_PREFIX}-prowlarr
    restart: unless-stopped
    networks:
      - hms-network
      - media_internal
    volumes:
      - ${STACK_DATA}/config/prowlarr:/config
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
    labels:
      traefik.enable: true
      traefik.docker.network: "hms-network"
      traefik.http.routers.prowlarr.rule: "Host(`prowlarr.${DOMAIN}`)"
      traefik.http.routers.prowlarr.tls: "true"
      traefik.http.routers.prowlarr.tls.certresolver: "cloudflare"
      traefik.http.routers.prowlarr.middlewares: "tinyauth@docker"
      traefik.http.services.prowlarr.loadbalancer.server.port: "9696"
      hms.description: "🔍 Indexador Prowlarr"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      flaresolverr:
        condition: service_healthy
      jackett:
        condition: service_healthy

  # Tdarr - Transcodificador de video
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: ${STACK_PREFIX}-tdarr
    restart: unless-stopped
    networks:
      - hms-network
      - media_internal
    volumes:
      - ${STACK_DATA}/config/tdarr/server:/app/server
      - ${STACK_DATA}/config/tdarr:/app/configs
      - ${STACK_DATA}/config/tdarr/logs:/app/logs
      - ${STACK_DATA}/library:/media/library                    # RW - procesa archivos de medios
      - ${STACK_DATA}/downloads:/media/downloads              # RW - procesa descargas nuevas
      - ${STACK_DATA}/config/tdarr/temp:/temp
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - nodeID=MainNode
      - ffmpegVersion=6
      - nodeName=${STACK_PREFIX}_node
    labels:
      traefik.enable: true
      traefik.docker.network: "hms-network"
      traefik.http.routers.tdarr.rule: "Host(`tdarr.${DOMAIN}`)"
      traefik.http.routers.tdarr.tls: "true"
      traefik.http.routers.tdarr.tls.certresolver: "cloudflare"
      traefik.http.routers.tdarr.middlewares: "tinyauth@docker"
      traefik.http.services.tdarr.loadbalancer.server.port: "8265"
      hms.description: "🔄 Transcodificador Tdarr"
    # Hardware acceleration configurado automáticamente via pre-deploy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8265/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Jackett - Agregador de trackers complementario a Prowlarr
  jackett:
    image: ghcr.io/hotio/jackett:latest
    container_name: ${STACK_PREFIX}-jackett
    restart: unless-stopped
    networks:
      - hms-network
      - media_internal
    volumes:
      - ${STACK_DATA}/config/jackett:/config
      - ${STACK_DATA}/downloads/watch:/media/downloads/watch        # RW - deposita .torrents en watch folder
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
    labels:
      traefik.enable: true
      traefik.docker.network: "hms-network"
      traefik.http.routers.jackett.rule: "Host(`jackett.${DOMAIN}`)"
      traefik.http.routers.jackett.tls: "true"
      traefik.http.routers.jackett.tls.certresolver: "cloudflare"
      traefik.http.routers.jackett.middlewares: "tinyauth@docker"
      traefik.http.services.jackett.loadbalancer.server.port: "9117"
      hms.description: "🔍 Agregador de trackers Jackett"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9117/UI/Dashboard"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      flaresolverr:
        condition: service_healthy

  # Flaresolverr - Resuelve CloudFlare challenges para Prowlarr/Jackett
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: ${STACK_PREFIX}-flaresolverr
    restart: unless-stopped
    networks:
      - media_internal
    volumes:
      - ${STACK_DATA}/config/flaresolverr:/config
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    # No necesita proxy inverso (solo para uso interno)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
