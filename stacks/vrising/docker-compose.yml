name: ${STACK_PREFIX}

x-hms:
  description: "Servidor de juego V Rising"
  public_ports:
    - { port: "${GAMEPORT}",  protocol: udp, description: "V Rising game" }
    - { port: "${QUERYPORT}", protocol: udp, description: "V Rising query" }

services:
  vrising:
    container_name: ${STACK_PREFIX}
    image: trueosiris/vrising
    restart: unless-stopped
    stop_grace_period: 2m
    # Required: https://github.com/TrueOsiris/docker-vrising#image-2026-02-21
    entrypoint: ["/bin/bash", "-c", "sed -i 's/\\r//g' /start.sh && exec /bin/bash /start.sh"]
    ports:
      - "${GAMEPORT}:${GAMEPORT}/udp"
      - "${QUERYPORT}:${QUERYPORT}/udp"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - SERVERNAME=${SERVER_NAME}
      - WORLDNAME=${WORLD_NAME}
      - GAMEPORT=${GAMEPORT}
      - QUERYPORT=${QUERYPORT}
      # Host settings
      - HOST_SETTINGS_Password=${PASSWORD}
      - HOST_SETTINGS_ListOnSteam=${LIST_ON_STEAM}
      - HOST_SETTINGS_ListOnEOS=${LIST_ON_EOS}
      - HOST_SETTINGS_GameSettingsPreset=${GAME_SETTINGS_PRESET}
      - HOST_SETTINGS_GameDifficultyPreset=${GAME_DIFFICULTY_PRESET}
      # QoL overrides (applied on top of preset)
      - GAME_SETTINGS_TeleportBoundItems=${TELEPORT_BOUND_ITEMS}
      - GAME_SETTINGS_CastleDecayRateModifier=${CASTLE_DECAY_RATE}
      - GAME_SETTINGS_CastleBloodEssenceDrainModifier=${BLOOD_ESSENCE_DRAIN}
      - GAME_SETTINGS_MaterialYieldModifier_Global=${MATERIAL_YIELD}
      - GAME_SETTINGS_CraftRateModifier=${CRAFT_RATE}
      - GAME_SETTINGS_RefinementRateModifier=${REFINEMENT_RATE}
      - GAME_SETTINGS_GameTimeModifiers__DayDurationInSeconds=${DAY_DURATION}
    volumes:
      - ${STACK_DATA}/server:/mnt/vrising/server
      - ${STACK_DATA}/persistentdata:/mnt/vrising/persistentdata
    labels:
      - "hms.description=🧛 Servidor de juego V Rising"
