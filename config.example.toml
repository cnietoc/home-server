[global]
host_root        = "__REQUIRED__"
puid             = "__REQUIRED__"
pgid             = "__REQUIRED__"
tz               = "__REQUIRED__"
domain           = "__REQUIRED__"
host_ip          = "__REQUIRED__"  # IP del host en la LAN (se autoconfigura en `hms install`)
# Opcional: URL de notificaciones Apprise (Telegram, Discord, Slack, etc.)
# Telegram: tgram://BOT_TOKEN/CHAT_ID
# Discord:  discord://TOKEN@WEBHOOK_ID
notification_url = ""

[infra.cloudflare]
email         = "__REQUIRED__"
dns_api_token = "__REQUIRED__"

[infra.auth]
google_client_id     = "__REQUIRED__"
google_client_secret = "__REQUIRED__"
oauth_whitelist      = "__REQUIRED__"

[infra.watchtower]
notification_url = "__REQUIRED__"

# Port-forwarding automático en el router via UPnP IGD o NAT-PMP.
# Requiere que UPnP esté habilitado en el router (ASUS: WAN → Enable UPnP).
# Para Docker: el contenedor de HMS necesita network_mode: host (UPnP)
# o usa backend = "natpmp" con gateway_ip explícito (funciona en bridge).
[router]
# enabled        = true
# backend        = "upnp"          # "upnp" | "natpmp" | "none"
# gateway_ip     = "192.168.1.1"   # IP del router; vacío = autodetección por SSDP
# lease_duration = "3600"          # segundos
# exclude_stacks = []              # p.ej. ["infra"] para gestionar Traefik a mano

# Monitorización del daemon HMS (health-watch / disk-watch)
[monitoring]
# disk_threshold_percent = 85   # avisar cuando el disco de data/ supere este %

[necesse]
password = "__REQUIRED__"

[corekeeper]
password = "__REQUIRED__"

[vrising]
password = "__REQUIRED__"

[terraria]
password = "__REQUIRED__"
