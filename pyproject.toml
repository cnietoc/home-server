# HMS Python Project Configuration
# Use with: uv pip install -r pyproject.toml

[project]
name = "hms"
version = "0.1.0"
description = "Home Server Management System"
authors = [{name = "Apocaly (cnietoc)"}]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "msal>=1.24.0",
    "apscheduler>=3.10",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "tomli>=2.0.0",
    "tomlkit>=0.12.0",
    "watchdog>=3.0.0",
    "pydantic>=2.0.0",
    "apprise>=1.7.0",
    "httpx>=0.27.0",
    "miniupnpc>=2.2",
]

[project.scripts]
hms = "hms.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra"]
