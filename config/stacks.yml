# Configuración de Stacks del Home Server
# =====================================
#
# Este archivo define la configuración de todos los stacks del home server,
# incluyendo qué archivos de configuración usan y qué servicios exponen.
#
# Configuración de servicios:
# - subdomain: Se combina automáticamente con BASE_DOMAIN desde common.env para formar https://subdomain.BASE_DOMAIN
#
# Formato YAML para mejor legibilidad y mantenimiento

stacks:
  # Stack de infraestructura base - siempre se despliega primero
  platform:
    description: "Servicios de infraestructura base"
    config_files:
      - cloudflare    # Para DNS y certificados SSL
      - auth          # Para configuración de TinyAuth
      - watchtower    # Para actualizaciones automáticas
    services:
      traefik:
        subdomain: traefik
        description: "🔀 Traefik Dashboard"
        protected: true
      tinyauth:
        subdomain: auth
        description: "🔐 Panel de Autenticación"
        protected: false
      watchtower:
        description: "🔄 Actualizaciones automáticas de imágenes"
        # Sin subdomain porque es un servicio en segundo plano

  # Home page del servidor
  home:
    description: "Página principal del Home Server con información dinámica"
    config_files: []  # Solo usa common.env
    services:
      web:
        subdomain: ""  # Sin subdominio - dominio principal
        description: "🏠 Home Server Dashboard"
        protected: false

  # Stack de medios y entretenimiento
  media:
    description: "Suite completa de medios: descargas, gestión y streaming"
    config_files:
      - media  # Configuración específica para servicios de media
    nfs_shares:
      media_library:
        path: "/library"
        exposed_path: "/media/library"
        description: "Biblioteca multimedia (películas y series)"
        permissions: "ro"  # Solo lectura para clientes
      downloads:
        path: "/downloads"
        exposed_path: "/media/downloads"
        description: "Carpeta de descargas activas"
        permissions: "rw"  # Lectura/escritura para gestión
    services:
      jellyfin:
        subdomain: "jellyfin"
        description: "🎬 Servidor de medios Jellyfin"
        protected: false
      radarr:
        subdomain: "radarr"
        description: "🎥 Gestor de películas Radarr"
        protected: true
      sonarr:
        subdomain: "sonarr"
        description: "📺 Gestor de series Sonarr"
        protected: true
      prowlarr:
        subdomain: "prowlarr"
        description: "🔍 Indexador Prowlarr"
        protected: true
      transmission:
        subdomain: "transmission"
        description: "⬇️ Cliente BitTorrent"
        protected: true
      bazarr:
        subdomain: "bazarr"
        description: "💬 Gestor de subtítulos Bazarr"
        protected: true
      tdarr:
        subdomain: "tdarr"
        description: "🔄 Transcodificador Tdarr"
        protected: true
      jackett:
        subdomain: "jackett"
        description: "🔍 Agregador de trackers Jackett"
        protected: true

  # Hello World - Ejemplo básico
  helloworld:
    description: "Servicio de ejemplo Hello World"
    config_files: []  # Solo usa common.env
    services:
      web:
        subdomain: test
        description: "👋 Página de bienvenida Hello World"
        protected: false
